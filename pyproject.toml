[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fletchscore"
dynamic = ["version"]
description = "Enregistrement des scores de compétitions d'archerie FFTL/IFAA (Indoor, Flint, Field...) -- saisie organisateur + vue compétiteur incluses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "customtkinter>=5.2",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "qrcode>=7.4",
    "cryptography>=41.0",
    "tkcalendar>=1.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
docs = ["sphinx>=7.0", "myst-parser>=2.0", "furo>=2024.1.29", "sphinxcontrib-mermaid>=0.9", "sphinx-design>=0.6"]
dev = ["black>=24.0", "ruff>=0.6"]

[project.scripts]
fletchscore = "fletchscore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fletchscore*"]

[tool.setuptools.package-data]
"fletchscore.web" = [
    "*.html", "*.js", "*.css", "*.png",
]

[tool.setuptools_scm]
# La version vient du tag git le plus proche (ex. tag "v0.1.2" -> version
# "0.1.2"), plus aucune ligne "version = ..." à maintenir à la main. Sur un
# commit qui n'est pas exactement un tag, produit une version de
# développement PEP 440 valide (ex. "0.1.3.dev4").
fallback_version = "0.0.0"  # utilisé seulement si aucun tag n'existe encore
local_scheme = "no-local-version"  # sans ça : suffixe +g<hash> ajouté, or
                                     # PyPI/TestPyPI refusent catégoriquement
                                     # toute "version locale" (PEP 440) à
                                     # l'upload -- voir la doc setuptools_scm
write_to = "src/fletchscore/_version.py"
# Génère aussi un simple fichier .py avec la version en clair, importable
# directement -- contrairement à `importlib.metadata.version(...)`, ça
# fonctionne aussi une fois empaqueté par PyInstaller, qui ne préserve pas
# forcément les métadonnées du paquet. Fichier généré à la construction,
# jamais committé (voir .gitignore).

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: tri des imports, UP: syntaxe moderne.
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # ligne trop longue -- laissé à Black, qui gère déjà ça
]
