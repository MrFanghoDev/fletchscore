name: Documentation (construction, publication, archivage)

# Un seul workflow pour tout le cycle de vie de la documentation Sphinx :
# - construction à chaque push touchant à la doc ou au code (docs/, src/)
#   -- attrape une erreur de construction tôt, sans attendre un tag
# - publication sur GitHub Pages UNIQUEMENT sur un tag, une Release
#   publiée, ou un lancement manuel -- jamais sur un simple push de
#   branche : GitHub Pages ignore silencieusement un second déploiement
#   pour un même SHA de commit (confirmé par leur support côté
#   FletchTime), ce qui rendait le déploiement d'un tag inopérant s'il
#   avait déjà été déployé juste avant via un simple push de branche
# - archivage (.tar.gz joint à la Release GitHub) sur un tag ou une
#   Release publiée
#
# Repris tel quel du modèle FletchTime (voir CLAUDE.md) -- même bug de
# dédup SHA déjà rencontré et corrigé côté FletchTime, pas de raison de le
# revivre ici.
#
# ⚠️ Bug corrigé après le premier vrai test : publier une Release sur un
# tag DÉJÀ existant (créé via l'UI GitHub après un `git push --tags`
# séparé) ne déclenche PAS de nouvel événement `push` -- seulement
# `release`. Sans le déclencheur `release` ci-dessous, ce workflow ne
# tournait jamais dans ce cas précis : doc jamais construite ni
# déployée, jamais d'archive jointe à la Release, alors que
# `build.yml::publish-pypi` (qui écoute déjà `release`) fonctionnait,
# donnant l'impression trompeuse que "tout" avait tourné.
#
# Configuration ponctuelle nécessaire (une seule fois, sur GitHub) :
#   Settings -> Pages -> Source: "GitHub Actions"

on:
  push:
    branches: [main, master]
    tags:
      - "v*.*.*"
    paths:
      - "docs/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Ignore les commits du bot de formatage automatique (voir test.yml) --
    # sans ça, ce commit déclenche un second run sur un commit décalé d'un
    # cran par rapport au tag qu'on vient de poser.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'corrections automatiques (black + ruff)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet (tags compris) -- nécessaire à
                           # setuptools_scm pour déterminer la version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le paquet et les dépendances de la doc
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Diagnostic -- ref déclencheur et version calculée
        run: |
          echo "Événement : ${{ github.event_name }}"
          echo "Ref déclencheur : ${{ github.ref }}"
          echo "SHA du commit : ${{ github.sha }}"
          echo "Version calculée par setuptools_scm :"
          python -c "from importlib.metadata import version; print(version('fletchscore'))"
          echo "Sortie de 'git describe' pour comparaison :"
          git describe --tags --long --always || echo "(aucun tag trouvé)"

      - name: Construire la doc HTML
        run: sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Créer l'archive de la doc (pour la Release, si on est sur un tag)
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          ARCHIVE_NAME: FletchScore-${{ github.ref_name }}-docs.tar.gz
        run: tar -czf "$ARCHIVE_NAME" -C docs/_build/html .

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: docs-archive
          path: FletchScore-*-docs.tar.gz

  deploy-pages:
    needs: build
    # Sur un tag, une Release publiée, ou un lancement manuel -- voir
    # l'explication du bug de dédup SHA en tête de fichier. La condition
    # sur github.event_name == 'release' est redondante avec
    # startsWith(github.ref, ...) en théorie (le ref d'un événement
    # release pointe déjà vers le tag), mais explicite plutôt que de
    # compter uniquement sur ce comportement.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  archive-on-release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-archive

      - name: Joindre l'archive à la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: FletchScore-*-docs.tar.gz
