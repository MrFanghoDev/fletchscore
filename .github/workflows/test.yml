name: Tests (lint + tests)

# Qualité continue : formatage/lint (Black + Ruff) puis suite de tests, à
# chaque push et pull request.
#
# - Sur un push direct (main/master) : Black et Ruff corrigent
#   automatiquement, et la correction est recommitée si besoin -- pratique
#   pour un projet à un seul mainteneur qui n'a pas toujours lancé les
#   formatteurs en local avant de pousser.
# - Sur une pull request : Black/Ruff tournent en mode vérification
#   seulement (`--check`) et font échouer le job si le code n'est pas
#   conforme, plutôt que de commiter directement sur la branche de la PR.
#
# Repris tel quel du modèle FletchTime -- voir CLAUDE.md.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LINT_PATHS: src tests run_tests.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Black et Ruff
        run: pip install black ruff

      - name: Black -- correction automatique (push direct)
        if: github.event_name == 'push'
        run: black ${{ env.LINT_PATHS }}

      - name: Ruff -- correction automatique (push direct)
        if: github.event_name == 'push'
        run: ruff check --fix ${{ env.LINT_PATHS }}

      - name: Commit des corrections automatiques, si nécessaire
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: corrections automatiques (black + ruff)"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Black -- vérification seule (pull request)
        if: github.event_name == 'pull_request'
        run: black --check --diff ${{ env.LINT_PATHS }}

      - name: Ruff -- vérification seule (pull request)
        if: github.event_name == 'pull_request'
        run: ruff check ${{ env.LINT_PATHS }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le paquet et ses dépendances
        # Sans cette étape, seuls les tests qui ne dépendent que de la
        # stdlib passaient -- tout ce qui a besoin d'une vraie dépendance
        # (openpyxl, fpdf2, customtkinter) échouait, ou était compté
        # "skipped" à tort en pensant que c'était l'environnement de dev
        # local qui manquait de réseau, alors que la CI ne l'installait
        # simplement jamais non plus. Bug réel remonté par l'utilisateur.
        run: pip install -e ".[dev]"

      - name: Lancer la suite de tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
